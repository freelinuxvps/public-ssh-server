name: Test SuperDMZ Token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Install SuperDMZ
        run: |
          curl -fsSL https://superdmz.com/download/LinuxInstaller.sh | sudo sh

      - name: Test Token Command
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          if [ -z "$SUPERDMZ_TOKEN" ]; then
            echo "ERROR: SUPERDMZ_TOKEN is empty"
            exit 1
          fi

          echo "Testing token command..."

          timeout 10s sudo superdmz-client -token "$SUPERDMZ_TOKEN" || true

          echo ""
          echo "========== STATE AFTER TOKEN =========="

          sudo superdmz-client -state || true

          echo ""
          echo "========== STATUS AFTER TOKEN =========="

          sudo superdmz-client -status || true
