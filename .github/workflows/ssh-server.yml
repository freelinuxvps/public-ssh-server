name: Public SSH Server

on:
  workflow_dispatch:

jobs:
  ssh-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # 1. نصب SSH
      - name: Install SSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server

          sudo mkdir -p /run/sshd

          sudo systemctl enable ssh
          sudo systemctl start ssh

          echo "SSH server started successfully"

      # 2. ساخت کاربر SSH
      - name: Create SSH User
        run: |
          if ! id yasin >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash yasin
          fi

          echo 'yasin:ChangeThisPassword123!' | sudo chpasswd

          sudo usermod -aG sudo yasin

          echo "SSH user created"

      # 3. نصب SuperDMZ
      - name: Install SuperDMZ Client
        run: |
          curl -fsSL https://superdmz.com/download/LinuxInstaller.sh | sudo sh

          echo "SuperDMZ Client installed"

      # 4. بررسی نسخه و وضعیت اولیه
      - name: Check SuperDMZ
        run: |
          echo "========== VERSION =========="
          sudo superdmz-client -version || true

          echo ""
          echo "========== STATE =========="
          sudo superdmz-client -state || true

          echo ""
          echo "========== STATUS =========="
          sudo superdmz-client -status || true

      # 5. ثبت Token
      - name: Configure SuperDMZ Tunnel
        env:
          SUPERDMZ_TOKEN: ${{ secrets.SUPERDMZ_TOKEN }}
        run: |
          if [ -z "$SUPERDMZ_TOKEN" ]; then
            echo "ERROR: SUPERDMZ_TOKEN secret is empty."
            exit 1
          fi

          echo "Configuring SuperDMZ tunnel..."

          sudo superdmz-client -token "$SUPERDMZ_TOKEN"

          echo "Token configured."

      # 6. بررسی وضعیت Tunnel
      - name: Check Tunnel
        run: |
          echo "Waiting for SuperDMZ..."
          sleep 5

          echo ""
          echo "========== SUPERDMZ STATUS =========="
          sudo superdmz-client -status || true

          echo ""
          echo "========== SUPERDMZ STATE =========="
          sudo superdmz-client -state || true

      # 7. بررسی SSH
      - name: Check SSH
        run: |
          echo "========== SSH STATUS =========="

          sudo systemctl status ssh --no-pager || true

          echo ""
          echo "========== PORT 22 =========="

          sudo ss -tlnp | grep ':22' || true

          echo ""
          echo "========== SSH USER =========="

          id yasin

      # 8. نمایش اطلاعات
      - name: Show Server Information
        run: |
          echo ""
          echo "=========================================="
          echo "          PUBLIC SSH SERVER"
          echo "=========================================="

          echo ""
          echo "SSH Username:"
          echo "yasin"

          echo ""
          echo "SSH Port:"
          echo "22"

          echo ""
          echo "SuperDMZ status:"
          sudo superdmz-client -status || true

          echo ""
          echo "=========================================="

      # 9. زنده نگه داشتن Runner
      - name: Keep Server Alive
        run: |
          echo "SSH server is running."

          while true; do
            echo ""
            echo "=========================================="
            echo "[$(date)] Server is alive"
            echo "=========================================="

            sudo systemctl is-active ssh || true
            sudo superdmz-client -status || true

            sleep 60
          done
